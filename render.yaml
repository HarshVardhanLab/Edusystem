services:
  - type: web
    name: edusystem-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn library_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: edusystem-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: edusystem-db
    databaseName: edusystem
    user: edusystem
